name: Update and verify sing-box rules

on:
  schedule:
    # Asia/Taipei: 01:17 and 05:43; same cadence as the reference repository.
    - cron: '17 17 * * *'
    - cron: '43 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'vendor/**'
      - 'data/**'
      - 'reference.lock.json'
      - 'examples/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'vendor/**'
      - 'data/**'
      - 'reference.lock.json'
      - 'examples/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'

permissions:
  contents: read

concurrency:
  group: singbox-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      TZ: UTC
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout this repository only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned dependency
        run: python -m pip install -r requirements.txt
      - name: Check reference logic and reviewed-input drift
        run: python -m scripts.reference --remote
      - name: Reference regression tests
        working-directory: vendor/passwall2
        run: python -m unittest discover -s tests -v
      - name: sing-box conversion regressions
        run: python -m unittest discover -s tests -v
      - name: Fetch verified official binaries and latest stable compatibility target
        run: python -m scripts.fetch_tools --latest
      - name: Fetch all original sources, build, and verify native routing
        run: python -m scripts.build
      - name: Require deterministic offline rebuild
        run: python -m scripts.reproducible
      - name: Check committed examples
        run: |
          build/tools/sing-box-1.14.3-linux-amd64/sing-box check -c examples/local.json
          build/tools/sing-box-1.13.0-linux-amd64/sing-box check -c examples/local.json
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conversion-failure-${{ github.run_id }}
          path: |
            build/failure.json
            build/reference-drift.json
          if-no-files-found: ignore
      - name: Publish fully validated generated changes to this repository
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'poohyeban/singbox-rules'
        run: |
          case "$(git remote get-url origin)" in
            https://github.com/poohyeban/singbox-rules|https://github.com/poohyeban/singbox-rules.git) ;;
            *) exit 1 ;;
          esac
          git add -- rules/ rule-set/ reports/
          if git diff --cached --quiet; then
            echo "No rule changes detected."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c commit.gpgsign=false commit -m 'Update verified sing-box rule sets'
          git push origin HEAD:main
